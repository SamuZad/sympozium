# -- Global image settings
image:
  registry: ghcr.io/sympozium-ai/sympozium
  pullPolicy: IfNotPresent
  # -- Override the image tag (defaults to .Chart.AppVersion)
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Namespace to deploy into (created if it doesn't exist)
createNamespace: true
namespace: sympozium-system

# -- Controller (reconciles CRDs, manages agent pods)
controller:
  replicas: 1
  image:
    repository: ""  # defaults to {{ .Values.image.registry }}/controller
    tag: ""
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  leaderElect: true
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- API Server (REST API for TUI/CLI and channel deployments)
apiserver:
  replicas: 1
  image:
    repository: ""  # defaults to {{ .Values.image.registry }}/apiserver
    tag: ""
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 8080
  # -- Web UI settings
  webUI:
    # -- Enable the embedded web dashboard
    enabled: true
    # -- Bearer token for API/UI authentication.
    # If empty, a random token is generated and stored in a Secret.
    # Retrieve it with: kubectl get secret <release>-ui-token -n <ns> -o jsonpath='{.data.token}' | base64 -d
    token: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- Webhook (admission controller for policy enforcement)
webhook:
  enabled: true
  replicas: 2
  image:
    repository: ""  # defaults to {{ .Values.image.registry }}/webhook
    tag: ""
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- NATS JetStream (event bus for agent IPC)
nats:
  # -- Deploy built-in NATS. Set to false if using an external NATS cluster.
  enabled: true
  image:
    repository: nats
    tag: 2-alpine
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  # -- External NATS URL (used when nats.enabled=false)
  externalUrl: ""
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- cert-manager integration for webhook TLS
certManager:
  # -- Requires cert-manager to be installed in the cluster
  enabled: true
  issuer:
    # -- Use "ClusterIssuer" for cluster-wide, "Issuer" for namespace-scoped
    kind: Issuer
    name: sympozium-selfsigned
    selfSigned: true
  certificate:
    duration: 8760h0m0s    # 1 year
    renewBefore: 720h  # 30 days

# -- CRD installation
crds:
  # -- Install CRDs with the chart. Disable if managing CRDs separately.
  install: true

# -- RBAC
rbac:
  # -- Create ClusterRole, ClusterRoleBinding, and ServiceAccounts
  create: true

# -- Network policies for agent pod isolation
networkPolicies:
  # -- Deploy default network policies (deny-all + allow-eventbus for agents)
  enabled: true
  # -- Extra TCP egress ports to allow from agent pods.
  # Use this for clusters where the Kubernetes API server listens on a
  # non-standard port (e.g. k3s with https-listen-port: 6444).
  # Example: [6444]
  extraEgressPorts: []

# -- Default SympoziumPolicies to install (permissive, restrictive, network-isolated)
defaultPolicies:
  # -- Install built-in policy presets
  enabled: true

# -- Default SkillPacks to install (code-review, incident-response, k8s-ops, sre-observability, llmfit, github-gitops, software-dev)
defaultSkills:
  enabled: true
  # -- List of SkillPack specs
  skills: []

# -- Default Ensembles to install (developer-team)
defaultPersonas:
  # -- Install built-in persona pack definitions (disabled by default, must be activated after install)
  enabled: true

# -- Default MCPServer catalog entries to install (github, grafana, kubernetes, argocd, postgres)
defaultMcpServers:
  # -- Install built-in MCP server definitions (must be configured with credentials after install)
  enabled: true

# -- Pod security context (applied to all control plane pods)
securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# -- Container security context (applied to all control plane containers)
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# -- OpenTelemetry Observability
observability:
  # -- Master switch. When false, all components init noop OTel (zero overhead).
  enabled: true
  # -- OTLP collector endpoint. Example: "http://otel-collector.monitoring.svc:4317"
  endpoint: "sympozium-otel-collector.sympozium-system.svc:4317"
  # -- OTLP transport: "grpc" (default, port 4317) or "http/protobuf" (port 4318)
  protocol: "grpc"
  # -- Static OTLP export headers (e.g., {"Authorization": "Bearer token"}).
  headers: {}
  # -- Secret reference for sensitive OTLP export headers.
  headersSecretRef: ""
  # -- Trace sampling probability: 0.0 (none) to 1.0 (all).
  samplingRatio: 1.0
  # -- Additional OTel resource attributes applied to ALL components.
  resourceAttributes: {}
  # -- Prefix for service names. Component name is appended.
  serviceNamePrefix: "sympozium"
  # -- Per-component tuning
  controller:
    batchTimeout: "5s"
  agentRunner:
    batchTimeout: "1s"
    shutdownTimeout: "10s"
  apiServer:
    batchTimeout: "5s"
  mcpBridge:
    batchTimeout: "1s"
  # -- Built-in OpenTelemetry collector. We default to the contrib distro
  # because we use the `transform` processor (OTTL) to normalize harness-
  # specific metric names (e.g. codex's `turn.token_usage` →
  # `gen_ai.client.token.usage`) so dashboards stay harness-agnostic.
  collector:
    image:
      repository: otel/opentelemetry-collector-contrib
      tag: "0.104.0"
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    service:
      otlpGrpcPort: 4317
      otlpHttpPort: 4318
      metricsPort: 8889
      healthPort: 13133
    # -- Prometheus exporter tuning (collector `prometheus` exporter).
    prometheus:
      # -- Convert OTel resource attributes (e.g. sympozium.agent_run.id,
      # sympozium.instance.name, k8s.namespace.name) into Prometheus labels.
      # Enables per-AgentRun / per-instance breakdowns of token usage and
      # other metrics. Note: agent_run.id is high-cardinality — every run
      # creates new label values — so enable deliberately.
      resourceToTelemetryConversion: false
      # -- Emit OpenMetrics exposition format (adds exemplars support).
      enableOpenMetrics: false
      # -- How long a metric stays exposed without a fresh data point.
      # Empty uses the exporter default (5m).
      metricExpiration: ""
    # -- Debug exporter verbosity (basic|normal|detailed).
    debug:
      verbosity: "normal"
  # -- Default instance observability settings (used when creating new instances)
  defaultInstance:
    enabled: true
    otlpEndpoint: "sympozium-otel-collector.sympozium-system.svc:4317"
    otlpProtocol: "grpc"
    serviceName: "sympozium"
    resourceAttributes:
      deployment.environment: "cluster"
      k8s.cluster.name: "unknown"

# -- Envoy Gateway (shared, cluster-wide)
gateway:
  enabled: false                  # Opt-in: deploys GatewayClass + Gateway
  gatewayClassName: sympozium
  name: sympozium-gateway
  baseDomain: ""                  # e.g. "sympozium.example.com" → instances get <name>.sympozium.example.com
  tls:
    enabled: false
    certManagerClusterIssuer: ""  # e.g. "letsencrypt-prod"
    secretName: sympozium-wildcard-cert

# -- Web Proxy (per-instance, controller-managed)
webProxy:
  image:
    repository: ""                # defaults to <registry>/web-proxy
    tag: ""
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# -- Node Probe DaemonSet (discovers inference providers on nodes)
nodeProbe:
  # -- Deploy the node-probe DaemonSet for discovering node-installed inference providers
  enabled: true
  image:
    repository: ""  # defaults to {{ .Values.image.registry }}/node-probe
    tag: ""
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 32Mi
  # -- Probe configuration
  config:
    probeInterval: 30s
    targets:
      - name: ollama
        port: 11434
        healthPath: /api/tags
        modelsPath: /api/tags
      - name: vllm
        port: 8000
        healthPath: /health
        modelsPath: /v1/models
      - name: llama-cpp
        port: 8080
        healthPath: /health
        modelsPath: /v1/models
      - name: lm-studio
        port: 1234
        healthPath: /v1/models
        modelsPath: /v1/models
  # -- Node selector to limit which nodes run the probe (default: all nodes)
  nodeSelector: {}
  # -- Tolerate all taints so probe runs on GPU and other tainted nodes
  tolerations:
    - operator: Exists
  affinity: {}

# -- llmfit DaemonSet (continuous per-node hardware fitness telemetry)
llmfit:
  daemonset:
    # -- Deploy the llmfit DaemonSet for continuous hardware fitness telemetry.
    # When enabled, the controller uses cached fitness data for instant model
    # placement instead of spawning probe pods.
    enabled: true
    image:
      repository: ""  # defaults to {{ .Values.image.registry }}/llmfit-daemon
      tag: ""
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    # -- Interval in seconds between fitness event publications
    eventInterval: 60
    # -- Node selector to limit which nodes run the daemon (default: all nodes)
    nodeSelector: {}
    # -- Tolerate all taints so daemon runs on GPU and other tainted nodes
    tolerations:
      - operator: Exists
    affinity: {}
  # -- Live eviction: re-place models when node fitness degrades
  liveEviction:
    enabled: false
    checkInterval: 30s
    degradeThreshold: 0.3
  # -- Pre-flight webhook: reject Model CRs that won't fit anywhere
  webhook:
    preflightValidation: false

# -- MCP Bridge (sidecar that connects agents to remote MCP tool servers)
mcpBridge:
  image:
    repository: ""  # defaults to {{ .Values.image.registry }}/mcp-bridge
    tag: ""
  resources:
    limits:
      cpu: 200m
      memory: 256Mi

# -- Kubernetes Agent Sandbox (kubernetes-sigs/agent-sandbox) integration.
# Enables an alternative execution backend using Sandbox CRDs for gVisor/Kata
# kernel-level isolation, warm pools for cold-start elimination, and
# suspend/resume lifecycle management.
# Requires: agent-sandbox CRDs installed in the cluster.
agentSandbox:
  # -- Enable Agent Sandbox CRD support. When false, all agent-sandbox features
  # are disabled and no RBAC rules for Sandbox CRs are created.
  enabled: false
  # -- Default runtimeClassName for Sandbox CRs ("gvisor", "kata", or "").
  # Used when no runtimeClass is specified on the AgentRun or policy.
  defaultRuntimeClass: "gvisor"
  # -- Create RBAC rules allowing the controller to manage Sandbox, SandboxClaim,
  # and SandboxWarmPool CRs (apiGroup: agents.x-k8s.io).
  rbac: true

# -- Cluster-local inference models.
# Each item creates a Model CR that the controller reconciles into
# PVC + Deployment + Service. Supports llama-cpp (GGUF), vLLM, TGI, or custom servers.
models:
  enabled: false
  items: []
  # -- llama-server example (GGUF, default serverType):
  # items:
  #   - name: llama-3.1-8b-q4
  #     url: "https://huggingface.co/bartowski/Meta-Llama-3.1-8B-Instruct-GGUF/resolve/main/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf"
  #     filename: "model.gguf"
  #     storageSize: "10Gi"
  #     gpu: 1
  #     memory: "16Gi"
  #     cpu: "4"
  #     contextSize: 4096
  #     args: []
  #
  # -- vLLM example (HuggingFace model, GPU required):
  #   - name: llama-3.1-8b-vllm
  #     serverType: vllm
  #     modelID: "meta-llama/Llama-3.1-8B-Instruct"
  #     storageSize: "50Gi"
  #     gpu: 1
  #     memory: "24Gi"
  #     cpu: "4"
  #     contextSize: 8192
  #     huggingFaceTokenSecret: "hf-token"
  #     args: ["--dtype", "auto"]
  #
  # -- TGI example (HuggingFace Text Generation Inference):
  #   - name: mistral-7b-tgi
  #     serverType: tgi
  #     modelID: "mistralai/Mistral-7B-Instruct-v0.3"
  #     storageSize: "30Gi"
  #     gpu: 1
  #     memory: "20Gi"
  #     cpu: "4"
  #     contextSize: 8192
  #     huggingFaceTokenSecret: "hf-token"

# -- ServiceMonitor for Prometheus (requires prometheus-operator)
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

# -- Central memory server (PostgreSQL + pgvector backed).
# Replaces per-Agent SQLite. Agents auth with their SA token (TokenReview).
# Cross-namespace sharing is gated by Ensemble.membrane export/import rules.
memory:
  # -- Master switch. Disables Deployment, Service, migration Job and Postgres.
  enabled: true

  # -- memory-server Deployment (HTTP API, scales horizontally).
  server:
    replicaCount: 1
    image:
      repository: ""  # defaults to {{ .Values.image.registry }}/memory-server
      tag: ""
    # -- ServiceAccount annotations (e.g. IRSA role ARN for AWS RDS IAM auth,
    # Workload Identity binding on GKE). The SA is created as a pre-install
    # hook so these annotations are present before the migrate Job pod is
    # admitted — required for the kubelet to project the right cloud token.
    serviceAccount:
      annotations: {}
      # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/sympozium-memory-server
    # Example:
    #   limits:
    #     cpu: "1"
    #     memory: 512Mi
    #   requests:
    #     cpu: 100m
    #     memory: 128Mi
    resources: {}
    service:
      type: ClusterIP
      port: 8080
    listen: ":8080"
    # -- TokenReview cache. Short TTL bounds revoked-token blast radius.
    tokenCache:
      ttl: "60s"
      size: 4096
    # -- Membership cache (Agent + Ensemble graph). Changes at human pace.
    membershipCache:
      ttl: "10m"
      size: 4096
    # -- Cluster-wide default memory TTL in days. 0 = no expiry.
    defaultTTLDays: 0
    # -- SAs that bypass scope filters and may call admin endpoints.
    # Format: "namespace/sa". Controller + apiserver SAs are added automatically.
    adminServiceAccounts: []
    nodeSelector: {}
    tolerations: []
    affinity: {}

  # -- One-shot schema migration Job (pre-install + pre-upgrade hook, idempotent).
  migrate:
    enabled: true
    # Example:
    #   limits:
    #     cpu: 500m
    #     memory: 256Mi
    #   requests:
    #     cpu: 100m
    #     memory: 64Mi
    resources: {}
    backoffLimit: 3
    activeDeadlineSeconds: 600

  # -- Database connection.
  database:
    # -- Connection string. Templated, so {{ .Release.Name }} etc. work.
    # Leave empty to use `urlSecret` or the bundled Postgres.
    url: ""
    # -- Existing Secret with key `DATABASE_URL`. Takes precedence over `url`.
    urlSecret: ""

    # -- Auth mode.
    #   "password" / "" — DATABASE_URL used verbatim (password, mTLS, peer, Cloud SQL Proxy, …)
    #   "rds-iam"       — re-mint AWS RDS IAM token per connection. Needs IRSA + AWS_REGION.
    auth:
      mode: "password"
      # Override AWS region for the rds-iam hook; defaults to env AWS_REGION.
      awsRegion: ""

  # -- Embedding provider (vectorises every write/search). Dimension MUST match
  # the SQL schema column type (vector(1536)). Changing it is a breaking op.
  #
  # Any OpenAI-compatible endpoint works via `baseURL` (Azure, Voyage AI,
  # Ollama, vLLM, …). Anthropic does not ship an embeddings API; pair Claude
  # with Voyage AI: baseURL=https://api.voyageai.com/v1, model=voyage-3.
  embedding:
    provider: "openai"
    model: "text-embedding-3-small"
    dimension: 1536
    baseURL: ""
    # -- Inline API key (chart creates a Secret) OR `apiKeySecretRef` pointing
    # at an existing Secret with key EMBEDDING_API_KEY.
    apiKey: ""
    apiKeySecretRef: ""

  # -- Bundled PostgreSQL + pgvector (single-node StatefulSet).
  # OFF by default: single pod, no HA/PITR/managed backups. Fine for
  # kind/dev/CI, NOT production. For prod, point `database.url` /
  # `database.urlSecret` at managed Postgres (RDS, Cloud SQL, CloudNativePG, …).
  postgres:
    enabled: false
    image:
      repository: "pgvector/pgvector"
      tag: "pg16"
    auth:
      database: "sympozium"
      username: "sympozium"
      # Plaintext password for the bundled Postgres. REQUIRED when
      # existingSecret is empty. The chart does NOT auto-generate one
      # because ArgoCD's `helm template` mode would re-render a different
      # random value on every sync, locking the running DB out.
      # For real environments, prefer existingSecret + SOPS / SealedSecrets /
      # external-secrets-operator.
      password: ""
      # Existing Secret with key `password`. Takes precedence over `password`.
      existingSecret: ""
    service:
      port: 5432
    persistence:
      enabled: true
      size: 20Gi
      storageClass: ""
    # Example:
    #   limits:
    #     cpu: "2"
    #     memory: 2Gi
    #   requests:
    #     cpu: 200m
    #     memory: 512Mi
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

