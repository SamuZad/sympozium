{{- if and .Values.memory.enabled .Values.memory.embedding.apiKey (not .Values.memory.embedding.apiKeySecretRef) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sympozium.memoryEmbeddingSecret" . }}
  namespace: {{ include "sympozium.namespace" . }}
  labels:
    {{- include "sympozium.labels" . | nindent 4 }}
    app.kubernetes.io/component: memory-server
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  EMBEDDING_API_KEY: {{ .Values.memory.embedding.apiKey | quote }}
{{- end }}
