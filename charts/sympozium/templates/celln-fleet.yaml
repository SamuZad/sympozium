{{- $fleet := .Values.celln.fleet | default dict }}
{{- if and .Values.celln.enabled $fleet.enabled }}
{{- if or .Values.celln.dispatcher.enabled .Values.celln.installer.enabled .Values.celln.nativeParent.enabled .Values.celln.router.external }}
{{- fail "celln.fleet replaces the single in-cluster dispatcher and cannot combine with installer, nativeParent or an external router" }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9][a-z0-9-]{0,62}$" ($fleet.scope | default "")) }}
{{- fail "celln.fleet.scope must be a stable DNS-label installation identity" }}
{{- end }}
{{- $package := $fleet.package | default dict }}
{{- if not (regexMatch "^[^@:[:space:]]+(:[0-9]+)?(/[^@[:space:]]+)?@sha256:[a-f0-9]{64}$" ($package.image | default "")) }}
{{- fail "celln.fleet.package.image must be a digest-pinned OCI reference (repository@sha256:...)" }}
{{- end }}
{{- if not (regexMatch "^blake3:[a-f0-9]{64}$" ($package.hash | default "")) }}
{{- fail "celln.fleet.package.hash must be the reviewed blake3 package hash" }}
{{- end }}
{{- if or (not $fleet.publisher) (not $fleet.principal) (not $fleet.parentClientsConfigMap) (not $fleet.configurationConfigMap) }}
{{- fail "celln.fleet requires publisher, principal, parentClientsConfigMap and configurationConfigMap" }}
{{- end }}
{{- if not .Values.celln.router.parentTokenSecret }}
{{- fail "celln.fleet requires router.parentTokenSecret for gateway parent routing" }}
{{- end }}
{{- /* Model backends: the celln.fleet.backends list, or the legacy single
     backend named native built from celln.fleet.model + modelCredential.
     Every node configures every backend and mounts every credential. */}}
{{- $backends := list }}
{{- range $fleet.backends | default list }}
{{- $backends = append $backends . }}
{{- end }}
{{- if not $backends }}
{{- $legacyModel := $fleet.model | default dict }}
{{- $legacyCredential := $fleet.modelCredential | default dict }}
{{- $backends = list (dict "name" "native" "provider" ($legacyModel.provider | default "") "protocol" ($legacyModel.protocol | default "") "endpoint" ($legacyModel.endpoint | default "") "model" ($legacyModel.name | default "") "allowInsecure" ($legacyModel.allowInsecure | default false) "credentialSecret" ($legacyCredential.secret | default "") "credentialPath" ($legacyCredential.path | default "/etc/celln-native/model-token")) }}
{{- end }}
{{- if gt (len $backends) 32 }}
{{- fail "celln.fleet.backends allows at most 32 model backends per scope" }}
{{- end }}
{{- $backendNames := dict }}
{{- $credentialDirs := dict }}
{{- $backendExport := list }}
{{- range $b := $backends }}
{{- $name := $b.name | default "" }}
{{- if or (not (regexMatch "^[a-z0-9][a-z0-9-]{0,31}$" $name)) (hasKey $backendNames $name) }}
{{- fail (printf "celln.fleet.backends: names must be unique DNS labels of at most 32 characters: %q" $name) }}
{{- end }}
{{- $_ := set $backendNames $name true }}
{{- $credential := $b.credentialPath | default "" }}
{{- if or (not $b.credentialSecret) (not (hasPrefix "/" $credential)) (contains ".." $credential) (eq (dir $credential) "/") (hasSuffix "/" $credential) }}
{{- fail (printf "celln.fleet.backends[%s] requires credentialSecret and a clean absolute credentialPath in a dedicated directory" $name) }}
{{- end }}
{{- if hasKey $credentialDirs (dir $credential) }}
{{- fail (printf "celln.fleet.backends[%s]: credentialPath directory %s is already used by another backend" $name (dir $credential)) }}
{{- end }}
{{- $_ := set $credentialDirs (dir $credential) $name }}
{{- $endpoint := $b.endpoint | default "" }}
{{- if and $endpoint (or (not $b.model) (not (has ($b.protocol | default "") (list "openai-chat" "anthropic-messages"))) (not $b.provider)) }}
{{- fail (printf "celln.fleet.backends[%s].endpoint needs provider, model and protocol openai-chat or anthropic-messages" $name) }}
{{- end }}
{{- if and $endpoint (hasPrefix "http://" $endpoint) (not $b.allowInsecure) }}
{{- fail (printf "celln.fleet.backends[%s].endpoint is plain HTTP; set allowInsecure=true to approve it" $name) }}
{{- end }}
{{- $backendExport = append $backendExport (dict "name" $name "provider" ($b.provider | default "") "protocol" ($b.protocol | default "") "endpoint" $endpoint "model" ($b.model | default "") "allowInsecure" ($b.allowInsecure | default false) "credentialFile" $credential) }}
{{- end }}
{{- $limits := $fleet.limits | default dict }}
{{- $lease := int64 ($limits.leaseSeconds | default 0) }}
{{- if and (ne $lease 0) (or (lt $lease 60) (gt $lease 86400)) }}
{{- fail "celln.fleet.limits.leaseSeconds must be 60-86400" }}
{{- end }}
{{- $capacity := $fleet.capacity | default "auto" }}
{{- if not (has $capacity (list "auto" "fixed")) }}
{{- fail "celln.fleet.capacity must be auto or fixed" }}
{{- end }}
{{- if and (eq $capacity "fixed") (lt (int $fleet.maxCells) 2) }}
{{- fail "celln.fleet.maxCells must allow a parent and a child" }}
{{- end }}
{{- $memoryPercent := int ($fleet.memoryPercent | default 75) }}
{{- $cellMemoryBytes := int64 ($fleet.cellMemoryBytes | default 671088640) }}
{{- $maxCellsCeiling := int ($fleet.maxCellsCeiling | default 1024) }}
{{- if or (lt $memoryPercent 1) (gt $memoryPercent 95) (lt $cellMemoryBytes 268435456) (lt $maxCellsCeiling 2) }}
{{- fail "celln.fleet auto capacity needs memoryPercent 1-95, cellMemoryBytes >= 256 MiB and maxCellsCeiling >= 2" }}
{{- end }}
{{- $state := printf "/var/lib/sympozium-celln/%s" $fleet.scope }}
{{- $root := printf "%s/authority" $state }}
{{- $image := printf "%s:%s" (.Values.celln.image.repository | default "ghcr.io/sympozium-ai/sympozium/celln-installer") (.Values.celln.image.tag | default .Chart.AppVersion) }}
{{- $backendSecret := (.Values.celln.bootstrap | default dict).backendTokenSecret | default "celln-dispatcher-backend" }}
{{- $journal := $fleet.journal | default dict }}
{{- if and $fleet.parentConfigSecret $journal.create }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $journal.claim | default "celln-parent-journal" | quote }}
  namespace: {{ include "sympozium.namespace" . }}
  labels:
    app.kubernetes.io/part-of: sympozium
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ $journal.storage | default "1Gi" | quote }}
  {{- with $journal.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: celln-node
  namespace: celln-system
  labels:
    app.kubernetes.io/part-of: sympozium
automountServiceAccountToken: false
---
# The preparing node publishes the scope's starter configuration once; later
# nodes only read and compare it. Nothing else in the namespace is reachable.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: celln-node-configuration
  namespace: celln-system
  labels:
    app.kubernetes.io/part-of: sympozium
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ $fleet.configurationConfigMap | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: celln-node-configuration
  namespace: celln-system
  labels:
    app.kubernetes.io/part-of: sympozium
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: celln-node-configuration
subjects:
  - kind: ServiceAccount
    name: celln-node
    namespace: celln-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: celln-fleet-prepare
  namespace: celln-system
  labels:
    app.kubernetes.io/part-of: sympozium
data:
  prepare.sh: |
{{ .Files.Get "files/celln/fleet-prepare.sh" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: celln-node
  namespace: celln-system
  labels:
    app.kubernetes.io/name: celln-node
    app.kubernetes.io/part-of: sympozium
spec:
  # Headless: the router resolves every ready owner's address itself and keeps
  # each parent bound to the address that issued it.
  clusterIP: None
  selector:
    app.kubernetes.io/name: celln-node
  ports:
    - name: http
      port: 8787
      targetPort: 8787
      protocol: TCP
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: celln-node
  namespace: celln-system
  labels:
    app.kubernetes.io/name: celln-node
    app.kubernetes.io/part-of: sympozium
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: celln-node
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celln-node
      annotations:
        celln.sympozium.ai/package: {{ $package.hash | quote }}
    spec:
      serviceAccountName: celln-node
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        celln.dev/kvm: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: prepare
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "/etc/celln-fleet/prepare.sh"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: FLEET_STATE
              value: {{ $state | quote }}
            - name: FLEET_PACKAGE_IMAGE
              value: {{ $package.image | quote }}
            - name: FLEET_PACKAGE_HASH
              value: {{ $package.hash | quote }}
            - name: FLEET_PACKAGE_INSECURE
              value: {{ $package.insecureRegistry | default false | quote }}
            - name: FLEET_PUBLISHER
              value: {{ $fleet.publisher | quote }}
            - name: FLEET_PRINCIPAL
              value: {{ $fleet.principal | quote }}
            - name: FLEET_SCOPE
              value: {{ $fleet.scope | quote }}
            - name: FLEET_BACKENDS
              value: {{ toJson $backendExport | quote }}
            - name: FLEET_LIMIT_LEASE_SECONDS
              value: {{ $limits.leaseSeconds | default 0 | quote }}
            - name: FLEET_LIMIT_MAX_TURNS
              value: {{ $limits.maxTurns | default 0 | quote }}
            - name: FLEET_LIMIT_MAX_MODEL_REQUESTS
              value: {{ $limits.maxModelRequests | default 0 | quote }}
            - name: FLEET_LIMIT_MAX_OUTPUT_TOKENS
              value: {{ $limits.maxOutputTokens | default 0 | quote }}
            - name: FLEET_PARENT_CLIENTS
              value: /etc/celln-fleet/clients/trusted-parent-clients.json
            - name: FLEET_CONFIGURATION_CONFIGMAP
              value: {{ $fleet.configurationConfigMap | quote }}
            - name: FLEET_NAMESPACE
              value: celln-system
          securityContext:
            privileged: true
          volumeMounts:
            - name: prepare
              mountPath: /etc/celln-fleet/prepare.sh
              subPath: prepare.sh
              readOnly: true
            - name: parent-clients
              mountPath: /etc/celln-fleet/clients
              readOnly: true
            {{- if $package.pullSecret }}
            - name: registry
              mountPath: /etc/celln-fleet/registry
              readOnly: true
            {{- end }}
            - name: publisher-credentials
              mountPath: /var/run/secrets/celln-fleet
              readOnly: true
            - name: state
              mountPath: {{ $state | quote }}
            - name: kvm
              mountPath: /dev/kvm
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
      containers:
        - name: dispatcher
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if eq $capacity "auto" }}
          # Size this node when the dispatcher starts: a share of the node's
          # memory (its cgroup limit when set), cells from the per-cell
          # declaration, and one broker slot per cell. A parent charges two
          # cells, two broker slots and its declared memory.
          command:
            - /bin/sh
            - -ec
            - |
              total=$(( $(awk '/^MemTotal:/ {print $2}' /proc/meminfo) * 1024 ))
              node=$total
              limit=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo max)
              if [ -n "$limit" ] && [ "$limit" != max ] && [ "$limit" -lt "$total" ]; then node=$limit; fi
              memory=$(( node / 100 * {{ $memoryPercent }} ))
              cells=$(( memory / {{ $cellMemoryBytes }} ))
              [ "$cells" -le {{ $maxCellsCeiling }} ] || cells={{ $maxCellsCeiling }}
              if [ "$cells" -lt 2 ]; then
                echo "celln capacity: node memory $node bytes cannot hold a parent and its child" >&2
                exit 1
              fi
              echo "celln capacity: node=$node memory=$memory cells=$cells egressSlots=$cells" >&2
              exec /usr/local/bin/celln "$@" --max-cells "$cells" --memory-bytes "$memory" --egress-slots "$cells"
            - celln-dispatcher
          {{- else }}
          command: ["/usr/local/bin/celln"]
          {{- end }}
          args:
            - dispatcher
            - --listen
            - 0.0.0.0:8787
            - --unsafe-non-loopback
            - --token-file
            - /etc/celln/backend/token
            - --root
            - {{ $root | quote }}
            - --mote-store
            - {{ printf "%s/motes" $root | quote }}
            - --tool-store
            - {{ printf "%s/tools" $root | quote }}
            - --node-name
            - $(NODE_NAME)
            {{- range $fleet.allowEgressHosts | default (list "api.deepseek.com") }}
            - --allow-egress-host
            - {{ . | quote }}
            {{- end }}
            {{- if eq $capacity "fixed" }}
            - --max-cells
            - {{ $fleet.maxCells | int | quote }}
            - --memory-bytes
            - {{ $fleet.memoryBytes | int64 | quote }}
            - --egress-slots
            - {{ $fleet.egressSlots | default $fleet.maxCells | quote }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8787
            periodSeconds: 2
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - |
                    printf 'Authorization: Bearer %s\n' "$(cat /etc/celln/backend/token)" | curl --fail --silent --show-error --max-time 50 --header @- --request POST http://127.0.0.1:8787/v1/drain
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: backend
              mountPath: /etc/celln/backend
              readOnly: true
            - name: state
              mountPath: {{ $state | quote }}
            {{- range $b := $backendExport }}
            - name: {{ printf "model-credential-%s" $b.name | quote }}
              mountPath: {{ dir $b.credentialFile | quote }}
              readOnly: true
            {{- end }}
            - name: kvm
              mountPath: /dev/kvm
            - name: boot
              mountPath: /boot
              readOnly: true
            - name: modules
              mountPath: /lib/modules
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: prepare
          configMap:
            name: celln-fleet-prepare
            defaultMode: 0555
        - name: parent-clients
          configMap:
            name: {{ $fleet.parentClientsConfigMap | quote }}
        {{- if $package.pullSecret }}
        - name: registry
          secret:
            secretName: {{ $package.pullSecret | quote }}
            defaultMode: 0400
        {{- end }}
        # Only the preparing step may reach the API; the dispatcher gets no token.
        - name: publisher-credentials
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: backend
          secret:
            secretName: {{ $backendSecret | quote }}
            defaultMode: 0440
        {{- range $i, $b := $backendExport }}
        - name: {{ printf "model-credential-%s" $b.name | quote }}
          secret:
            secretName: {{ (index $backends $i).credentialSecret | quote }}
            defaultMode: 0400
            items:
              - key: token
                path: {{ base $b.credentialFile | quote }}
        {{- end }}
        - name: state
          hostPath:
            path: {{ $state | quote }}
            type: DirectoryOrCreate
        - name: kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
        - name: boot
          hostPath:
            path: /boot
            type: Directory
        - name: modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: tmp
          emptyDir: {}
{{- end }}
