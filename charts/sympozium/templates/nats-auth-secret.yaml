{{- if and .Values.nats.enabled .Values.nats.auth.enabled (not .Values.nats.auth.existingSecret) }}
{{- $existing := lookup "v1" "Secret" (include "sympozium.namespace" .) (include "sympozium.natsAuthSecret" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sympozium.natsAuthSecret" . }}
  namespace: {{ include "sympozium.namespace" . }}
  labels:
    {{- include "sympozium.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
type: Opaque
data:
  {{- /* nats.conf references these as bare $VARIABLES; a value that starts
       with a digit is parsed as a number or duration and breaks the server
       ("Expected a top-level value to end with a new line ... got '1'"), so
       every generated password starts with a letter. */}}
  control-password: {{ if $existing }}{{ index $existing.data "control-password" }}{{ else }}{{ printf "%s%s" (randAlpha 1) (randAlphaNum 39) | b64enc }}{{ end }}
  bridge-password: {{ if $existing }}{{ index $existing.data "bridge-password" }}{{ else }}{{ printf "%s%s" (randAlpha 1) (randAlphaNum 39) | b64enc }}{{ end }}
{{- end }}
