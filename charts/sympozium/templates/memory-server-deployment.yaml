{{- if .Values.memory.enabled }}
{{- $fullname := include "sympozium.fullname" . }}
{{- $ns := include "sympozium.namespace" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-memory-server
  namespace: {{ $ns }}
  labels:
    {{- include "sympozium.labels" . | nindent 4 }}
    app.kubernetes.io/component: memory-server
spec:
  type: {{ .Values.memory.server.service.type }}
  ports:
    - name: http
      port: {{ .Values.memory.server.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "sympozium.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: memory-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-memory-server
  namespace: {{ $ns }}
  labels:
    {{- include "sympozium.labels" . | nindent 4 }}
    app.kubernetes.io/component: memory-server
spec:
  replicas: {{ .Values.memory.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "sympozium.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: memory-server
  template:
    metadata:
      labels:
        {{- include "sympozium.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: memory-server
    spec:
      {{- if .Values.rbac.create }}
      serviceAccountName: {{ $fullname }}-memory-server
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: memory-server
          image: {{ include "sympozium.memoryServerImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          env:
            {{- include "sympozium.memoryServerEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.memory.server.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      {{- with .Values.memory.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.memory.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.memory.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
