{{- if .Values.artifact.enabled }}
{{- $fullname := include "sympozium.fullname" . }}
{{- $ns := include "sympozium.namespace" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-artifact-server
  namespace: {{ $ns }}
  labels:
    {{- include "sympozium.labels" . | nindent 4 }}
    app.kubernetes.io/component: artifact-server
spec:
  type: {{ .Values.artifact.service.type }}
  ports:
    - name: http
      port: {{ .Values.artifact.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "sympozium.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: artifact-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-artifact-server
  namespace: {{ $ns }}
  labels:
    {{- include "sympozium.labels" . | nindent 4 }}
    app.kubernetes.io/component: artifact-server
spec:
  # Filesystem-backed with a ReadWriteOnce PVC — keep to a single replica.
  replicas: {{ .Values.artifact.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sympozium.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: artifact-server
  template:
    metadata:
      labels:
        {{- include "sympozium.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: artifact-server
    spec:
      {{- if .Values.rbac.create }}
      serviceAccountName: {{ $fullname }}-artifact-server
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
        # The blob PVC is mounted root-owned by default; fsGroup makes it
        # group-owned and writable by the nonroot container user (uid/gid
        # 65532 in the distroless image).
        fsGroup: {{ .Values.artifact.fsGroup }}
      containers:
        - name: artifact-server
          image: {{ include "sympozium.artifactServerImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ARTIFACT_LISTEN
              value: {{ .Values.artifact.listen | quote }}
            - name: ARTIFACT_DATA_DIR
              value: {{ .Values.artifact.dataDir | quote }}
            - name: ARTIFACT_MAX_BYTES
              value: {{ .Values.artifact.maxBytes | quote }}
            - name: ARTIFACT_TTL
              value: {{ .Values.artifact.ttl | quote }}
            - name: ARTIFACT_TOKEN_CACHE_TTL
              value: {{ .Values.artifact.tokenCache.ttl | quote }}
            - name: ARTIFACT_TOKEN_CACHE_SIZE
              value: {{ .Values.artifact.tokenCache.size | quote }}
            {{- with .Values.artifact.readerServiceAccounts }}
            - name: ARTIFACT_READER_SERVICE_ACCOUNTS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- $admins := .Values.artifact.adminServiceAccounts | default list }}
            {{- $admins = append $admins (printf "%s/sympozium-controller-manager" $ns) }}
            - name: ARTIFACT_ADMIN_SAS
              value: {{ join "," $admins | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.artifact.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.artifact.dataDir }}
      volumes:
        - name: data
          {{- if .Values.artifact.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $fullname }}-artifact-server
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.artifact.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.artifact.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.artifact.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
